config:
  default: true
  MD013: false        # no hard line-length limit (prose)
  MD033: false        # allow inline HTML (raw tables from converted documents)
  MD041: false        # first line need not be a top-level heading
  MD034: false        # allow bare URLs
  MD040: false        # fenced blocks needn't specify a language (directory trees)
  # MD051 (link-fragments) is off because a book's citations are Obsidian block
  # references: [Author, 1979](#^ref-author-1979) pointing at a ^ref-... block ID
  # on the matching line of the chapter's reference list. They resolve in Obsidian
  # and on the built site; markdownlint understands only heading anchors and reports every
  # one as broken. This is the convention the author site's citation links use, so leaving
  # the rule on turns CI red on every chapter that cites anything.
  MD051: false
  MD024:
    siblings_only: true
ignores:
  - "node_modules/**"
  - "templates/**"     # unrendered placeholders
  - "scripts/seed-index.md" # the front page before new-book.mjs fills it in
