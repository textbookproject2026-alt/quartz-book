name: design-preview

# The design preview gate (BOOK-ONE-TO-QUARTZ §4b, §8 step 11). For a pull
# request into main: every book on the builder, its live branch built by the
# pull request's builder commit, deployed to the book's Pages project on the
# branch design-<pr>, then one comment on the pull request with a link per
# book. Production is never deployed from here: the Pages branch is always
# design-<number>, never a book's live branch.
#
# Three jobs, split as in reconcile-book.yml: the build holds no secrets (book
# content is maintainer-controlled input to Quartz), the deploy holds only the
# Cloudflare token, the comment only pull-requests: write.
#
# A pull request from a fork builds, but isn't deployed or commented on: its
# workflows get no secrets. The bot's pull requests start it like any other when
# the bot App opens them. When bump-extras.yml falls back to GITHUB_TOKEN, their
# pull_request run is held for approval, so it also starts this with
# workflow_dispatch.
# By hand: Actions → design-preview → Run workflow, on the pull request's
# branch, with its number.

run-name: >-
  design-preview: #${{ inputs.pr || github.event.number }}

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: The pull request's number.
        required: true

permissions:
  contents: read

concurrency:
  group: design-preview-${{ inputs.pr || github.event.number }}
  cancel-in-progress: true

env:
  PR: ${{ inputs.pr || github.event.number }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head: ${{ steps.pr.outputs.head }}
      deploy: ${{ steps.pr.outputs.deploy }}
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - name: Which pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$PR" =~ ^[1-9][0-9]*$ ]] || { echo "::error::\"$PR\" is not a pull request number."; exit 1; }
          gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json state,baseRefName,headRefOid,isCrossRepository > "$RUNNER_TEMP/pr.json"
          jq . "$RUNNER_TEMP/pr.json"
          [ "$(jq -r .state "$RUNNER_TEMP/pr.json")" = OPEN ] || { echo "::error::#$PR is not open."; exit 1; }
          [ "$(jq -r .baseRefName "$RUNNER_TEMP/pr.json")" = main ] || { echo "::error::#$PR is not into main."; exit 1; }
          echo "head=$(jq -r .headRefOid "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"
          echo "deploy=$(jq -r '.isCrossRepository | not' "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.head }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Every book on the builder
        id: plan
        run: node builder/preview.mjs plan "$PR"

  build:
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    name: build ${{ matrix.target.slug }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEAD: ${{ needs.plan.outputs.head }}
      SLUG: ${{ matrix.target.slug }}
      REPO: ${{ matrix.target.repo }}
      BRANCH: ${{ matrix.target.branch }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.head }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      # Restore only, as in reconcile-book.yml. The key is the pull request's
      # lock, so a pin bump misses and installs the new pins.
      - name: Restore Quartz plugins
        uses: actions/cache/restore@v5
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}

      - run: npm ci

      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Check out the book's live branch, anonymously
        id: book
        run: |
          commit="$(git -c credential.helper= ls-remote --exit-code "https://github.com/$REPO.git" "refs/heads/$BRANCH" | cut -f1)"
          git init --quiet "$RUNNER_TEMP/book"
          cd "$RUNNER_TEMP/book"
          git -c credential.helper= fetch --quiet --depth 60 "https://github.com/$REPO.git" "$commit"
          git checkout --quiet --detach FETCH_HEAD
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Build, as a noindex preview
        run: ./build-book.sh "$RUNNER_TEMP/book" --branch "$BRANCH" --preview --out "$RUNNER_TEMP/site"

      - name: Check it is this builder's preview of that commit
        env:
          COMMIT: ${{ steps.book.outputs.commit }}
        run: |
          node -e '
            const m = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))
            const want = { slug: process.env.SLUG, branch: process.env.BRANCH,
                           book_commit: process.env.COMMIT, builder_commit: process.env.HEAD }
            for (const [k, v] of Object.entries(want))
              if (m[k] !== v) { console.error(`::error::the marker has ${k} ${m[k]}, not ${v}.`); process.exit(1) }
          ' "$RUNNER_TEMP/site/.well-known/textbook.json"
          grep -qi 'X-Robots-Tag: noindex' "$RUNNER_TEMP/site/_headers" \
            || { echo "::error::the preview has no noindex _headers."; exit 1; }

      - name: Keep the site for the deploy job
        uses: actions/upload-artifact@v7
        with:
          name: preview-${{ matrix.target.slug }}
          path: ${{ runner.temp }}/site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  deploy:
    needs: [plan, build]
    if: needs.plan.outputs.deploy == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    name: deploy ${{ matrix.target.slug }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    env:
      HEAD: ${{ needs.plan.outputs.head }}
      SLUG: ${{ matrix.target.slug }}
      PROJECT: ${{ matrix.target.project }}
      PREVIEW: ${{ matrix.target.preview }}
      URL: ${{ matrix.target.url }}
    steps:
      # The one guard that keeps production out of reach: whatever the plan
      # said, only a design-<number> branch is ever deployed from here.
      - name: Check this is a preview branch
        run: |
          [[ "$PREVIEW" =~ ^design-[1-9][0-9]*$ ]] || { echo "::error::\"$PREVIEW\" is not a design-<number> branch."; exit 1; }
          [ "$PREVIEW" = "design-$PR" ] || { echo "::error::\"$PREVIEW\" is not this pull request's branch."; exit 1; }

      - name: Check the Cloudflare secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::the secret $name is empty or not set in quartz-book."
              missing=1
            fi
          done
          exit $missing

      - uses: actions/download-artifact@v8
        with:
          name: preview-${{ matrix.target.slug }}
          path: site

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Upload to the book's Pages project, on the preview branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          commit="$(node -p 'require("./site/.well-known/textbook.json").book_commit')"
          npx --yes wrangler@4.137.0 pages deploy site \
            --project-name "$PROJECT" \
            --branch "$PREVIEW" \
            --commit-hash "$commit" \
            --commit-message "design preview #$PR: $SLUG at ${commit:0:7}, builder ${HEAD:0:7}" \
            --commit-dirty=true

      - name: Check Pages serves it, noindex
        run: |
          for i in $(seq 1 24); do
            if curl -fsS -H 'cache-control: no-cache' "${URL}.well-known/textbook.json?deploy=$GITHUB_RUN_ID-$i" -o served.json \
               && cmp -s served.json site/.well-known/textbook.json; then
              echo "Pages serves the preview at $URL"; cat served.json
              curl -fsSI "$URL" | tee headers.txt
              grep -qi '^x-robots-tag: *noindex' headers.txt || { echo "::error::$URL has no X-Robots-Tag: noindex."; exit 1; }
              exit 0
            fi
            sleep 5
          done
          echo "::error::after two minutes, $URL doesn't serve the preview just deployed."
          exit 1

  comment:
    needs: [plan, deploy]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      HEAD: ${{ needs.plan.outputs.head }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.head }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      # One comment per pull request, updated on each run.
      - name: Comment with a link per book
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          node builder/preview.mjs comment "$PR" "$HEAD" || status=$?
          body="$RUNNER_TEMP/preview-comment.md"
          [ -s "$body" ] || exit 1
          id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
                --jq '.[] | select(.body | startswith("<!-- quartz-book design preview -->")) | .id' | head -n 1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$body" --silent
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F "body=@$body" --silent
          fi
          exit $status
