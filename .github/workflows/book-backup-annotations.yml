name: book-backup-annotations

# A book's weekly Hypothes.is annotation backup, as a reusable workflow
# (BOOK-ONE-TO-QUARTZ §8 step 14, D6). The book's thin caller:
#
#   on:
#     schedule:
#       - cron: "0 3 * * 0"
#     workflow_dispatch:
#   permissions:
#     contents: write
#   jobs:
#     backup:
#       uses: textbookproject2026-alt/quartz-book/.github/workflows/book-backup-annotations.yml@stable
#       secrets:
#         HYPOTHESIS_API_TOKEN: ${{ secrets.HYPOTHESIS_API_TOKEN }}
#
# The secret is passed by name, not with `secrets: inherit`, which works only
# inside one organisation, and books live in their maintainers' accounts.
#
# automation/scripts/backup-annotations.mjs writes one file per run,
# backups/annotations-YYYY-MM-DD.json, which is committed to the book's
# `backups` branch (created on the first run), keeping the newest `keep` files.
# The backups live there rather than on main because main requires pull requests
# and github-actions[bot] cannot bypass that. What is backed up (the site, its
# former origins and the private groups) comes from the book's registry entry.
#
# Exit codes from the script: 0 = every scope collected; 2 = at least one scope
# failed but the others were written (committed, then this run fails so a person
# looks); anything else = nothing was written.

on:
  workflow_call:
    inputs:
      branch:
        description: The book's live branch; the per-URI fallback reads its pages.
        required: false
        type: string
        default: main
      keep:
        description: How many weekly files to retain.
        required: false
        type: string
        default: "12"
      platform_ref:
        description: The quartz-book ref the script is taken from. Keep it the ref the caller names after the @.
        required: false
        type: string
        default: stable
    secrets:
      HYPOTHESIS_API_TOKEN:
        required: false

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the backup commit to the `backups` branch
    concurrency:
      group: book-backup-annotations
      cancel-in-progress: false
    env:
      BACKUP_BRANCH: backups
      KEEP: ${{ inputs.keep }}

    steps:
      - name: Check the API token secret is present
        env:
          HYPOTHESIS_API_TOKEN: ${{ secrets.HYPOTHESIS_API_TOKEN }}
        run: |
          if [ -z "$HYPOTHESIS_API_TOKEN" ]; then
            echo "::error::HYPOTHESIS_API_TOKEN did not reach this workflow. Add it to the book repo under Settings -> Secrets and variables -> Actions (a token from https://hypothes.is/account/developer, signed in as the account that owns the annotation groups), and check that the caller passes it under secrets:."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Fetch the platform's scripts
        env:
          REF: ${{ inputs.platform_ref }}
        run: |
          set -euo pipefail
          git -c credential.helper= clone --quiet --depth 1 --branch "$REF" --filter=blob:none --sparse \
            https://github.com/textbookproject2026-alt/quartz-book.git "$RUNNER_TEMP/platform"
          git -C "$RUNNER_TEMP/platform" sparse-checkout set automation
          echo "quartz-book at $REF: $(git -C "$RUNNER_TEMP/platform" rev-parse HEAD)"

      - name: Check out the backups branch (create it on first run)
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          DIR="${{ runner.temp }}/backups-branch"

          # ls-remote --exit-code: 0 = the branch exists, 2 = it doesn't, anything
          # else = the remote could not be reached, which must not read as "missing".
          set +e
          git ls-remote --exit-code --heads "$REMOTE" "$BACKUP_BRANCH" >/dev/null 2>&1
          rc=$?
          set -e

          case "$rc" in
            0)
              echo "Branch '$BACKUP_BRANCH' exists — cloning it."
              git clone --quiet --depth 1 --branch "$BACKUP_BRANCH" --single-branch "$REMOTE" "$DIR"
              ;;
            2)
              echo "Branch '$BACKUP_BRANCH' not found — creating it (first run)."
              mkdir -p "$DIR"
              git -C "$DIR" init --quiet -b "$BACKUP_BRANCH"
              git -C "$DIR" remote add origin "$REMOTE"
              cat > "$DIR/README.md" <<'EOF'
          # Annotation backups

          This branch holds nothing but weekly Hypothes.is annotation snapshots,
          written by the book's annotation backup workflow on its live branch
          (the platform's reusable workflow, quartz-book's
          `.github/workflows/book-backup-annotations.yml`).

          Backups live here rather than on `main` because `main` requires pull
          requests and `github-actions[bot]` cannot bypass that rule.

          Each file is the raw API output for every scope: the public layer on the
          book's site, the public layer left on each former domain, and each
          private group. See the header of quartz-book's
          `automation/scripts/backup-annotations.mjs` for what they contain.
          EOF
              ;;
            *)
              echo "::error::Could not reach the remote to check for the '$BACKUP_BRANCH' branch (git ls-remote exit code $rc)."
              exit 1
              ;;
          esac

          git -C "$DIR" config user.name "github-actions[bot]"
          git -C "$DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch annotations
        id: fetch
        env:
          HYPOTHESIS_API_TOKEN: ${{ secrets.HYPOTHESIS_API_TOKEN }}
        run: |
          set -euo pipefail
          DIR="${{ runner.temp }}/backups-branch"

          set +e
          node "$RUNNER_TEMP/platform/automation/scripts/backup-annotations.mjs" \
            --out-dir "$DIR/backups" \
            --keep "$KEEP"
          rc=$?
          set -e

          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "::error::Annotation backup failed (exit $rc); nothing was written."
            exit "$rc"
          fi

      - name: Commit and push to the backups branch
        run: |
          set -euo pipefail
          DIR="${{ runner.temp }}/backups-branch"
          cd "$DIR"

          git add -A

          if git diff --cached --quiet; then
            echo "No change since the last backup — nothing to commit."
            exit 0
          fi

          SUMMARY="$(node -e '
            const fs = require("fs");
            const f = fs.readdirSync("backups").filter(n => /^annotations-\d{4}-\d{2}-\d{2}\.json$/.test(n)).sort().pop();
            const m = JSON.parse(fs.readFileSync("backups/" + f, "utf8")).meta;
            console.log(Object.entries(m.scopes).map(([k, v]) => `${k}=${v.count}`).join(" "));
          ')"

          DATE="$(date -u +%Y-%m-%d)"
          git commit -q -m "chore(backups): annotations ${DATE}" -m "${SUMMARY}"
          git push --quiet origin "HEAD:${BACKUP_BRANCH}"
          echo "Pushed to ${BACKUP_BRANCH}: ${SUMMARY}"
          echo "### Annotation backup ${DATE}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${SUMMARY}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the run if any scope was incomplete
        if: steps.fetch.outputs.rc == '2'
        run: |
          echo "::error::At least one annotation scope failed to collect. The partial backup was committed (meta.complete = false in the file) — check the 'Fetch annotations' step log for which scope and why."
          exit 1
