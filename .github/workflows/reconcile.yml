name: reconcile

# Builds and deploys every book whose served build marker is behind what a build
# would produce now (BOOK-ONE-TO-QUARTZ §0a, §8 step 9). It compares state, and
# never trusts what woke it, so a run with nothing to do finishes in seconds and
# running it again is always safe.
#
# workflow_dispatch only. There is deliberately no `schedule:` here: GitHub turns
# off scheduled workflows in a public repo after 60 quiet days. From §8 step 10
# the `build-nudge` Worker dispatches this (woken_by nudge, and cron every 15
# minutes). Until then, and whenever the Worker is down, run it by hand:
# Actions → reconcile → Run workflow, with `slug` empty for every book.
#
# Only a run from `main` deploys. A run from any other branch builds and checks,
# and deploys nothing.

run-name: >-
  reconcile: ${{ inputs.woken_by || 'by hand' }}, ${{ inputs.slug || 'every book' }}${{
  inputs.unrecorded_book && format(' + unrecorded {0}', inputs.unrecorded_book) || '' }}

on:
  workflow_dispatch:
    inputs:
      slug:
        description: One book's slug. Empty for every book on the builder.
        required: false
        default: ""
      woken_by:
        description: "`nudge` or `cron` when the build-nudge Worker starts the run. Empty by hand."
        required: false
        default: ""
      # TEMPORARY: §8 step 9 until step 17. Remove this input, and its use
      # below, in the step 17 pull request.
      unrecorded_book:
        description: >-
          Until §8 step 17 only. Also build this book, whose registry entry doesn't
          name the builder yet (book one: social-research-methods). Its Pages project
          is named after its slug.
        required: false
        default: ""

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - name: Check the inputs
        env:
          WOKEN_BY: ${{ inputs.woken_by }}
          SLUG: ${{ inputs.slug }}
          UNRECORDED_BOOK: ${{ inputs.unrecorded_book }}
        run: |
          case "$WOKEN_BY" in ""|nudge|cron) ;; *) echo "::error::woken_by must be empty, nudge or cron, not \"$WOKEN_BY\"."; exit 1 ;; esac
          for v in "$SLUG" "$UNRECORDED_BOOK"; do
            [[ -z "$v" || "$v" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "::error::\"$v\" is not a slug."; exit 1; }
          done

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Compare each book and branch with its served marker
        id: plan
        env:
          SLUG: ${{ inputs.slug }}
          UNRECORDED_BOOK: ${{ inputs.unrecorded_book }}
        run: node builder/reconcile.mjs plan

  book:
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    name: ${{ matrix.target.slug }} ${{ matrix.target.branch }}
    # One build per book and branch at a time, and never cancelled. GitHub keeps
    # at most one pending run per group, and the pending one re-reads the branch
    # head when it starts, so a burst of pushes costs at most two builds (§0a).
    concurrency:
      group: book-${{ matrix.target.slug }}-${{ matrix.target.branch }}
      cancel-in-progress: false
    uses: ./.github/workflows/reconcile-book.yml
    with:
      slug: ${{ matrix.target.slug }}
      branch: ${{ matrix.target.branch }}
      project: ${{ matrix.target.project }}
      live: ${{ matrix.target.live }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
