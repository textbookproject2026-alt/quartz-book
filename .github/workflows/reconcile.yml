name: reconcile

# Builds and deploys every book whose served build marker is behind what a build
# would produce now (BOOK-ONE-TO-QUARTZ §0a, §8 step 9). It compares state, and
# never trusts what woke it, so a run with nothing to do finishes in seconds and
# running it again is always safe.
#
# workflow_dispatch only. There is deliberately no `schedule:` here: GitHub turns
# off scheduled workflows in a public repo after 60 quiet days. From §8 step 10
# the `build-nudge` Worker dispatches this (woken_by nudge, and cron every 15
# minutes). Until then, and whenever the Worker is down, run it by hand:
# Actions → reconcile → Run workflow, with `slug` empty for every book.
#
# Only a run from `main` deploys, and it builds with the builder at the `stable`
# tag, not at main's head (§4b, §8 step 11). stable.yml moves the tag when CI on
# main is green; the pull request's design preview came first. A run from any
# other branch builds with that branch's own commit, and deploys nothing.
#
# Every run from main first keeps each book's drafts branch current with its live
# branch (the drafts job), so the plan sees, and builds, the moved drafts.
# On the 15-minute tick it also flags work outside drafts (the branches job),
# and asks whether quartz-edition-extras' main is
# ahead of the pin, and if so starts bump-extras.yml, the bot pull request.

run-name: >-
  reconcile: ${{ inputs.woken_by || 'by hand' }}, ${{ inputs.slug || 'every book' }}

on:
  workflow_dispatch:
    inputs:
      slug:
        description: One book's slug. Empty for every book on the builder.
        required: false
        default: ""
      woken_by:
        description: "`nudge` or `cron` when the build-nudge Worker starts the run, `stable` when stable.yml does. Empty by hand."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # Drafts current with the live branch (builder/sync-drafts.mjs, 06 Oct), for
  # the books in this run. A no-op when drafts has everything; otherwise a
  # fast-forward or a merge, pushed as one of two Apps: the books App in the books
  # org, the quartz-book bot App in the platform's own account. build-nudge
  # ignores those Apps' pushes to a drafts branch, so this never starts another
  # run: the plan below already reads the new head. Every step is
  # continue-on-error and only main's steps run, so this job always succeeds and
  # never holds up the plan (a skipped or failed job would skip every job after
  # it).
  drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        if: github.ref == 'refs/heads/main'
        with:
          ref: refs/tags/stable
          persist-credentials: false

      - uses: actions/setup-node@v6
        if: github.ref == 'refs/heads/main'
        with:
          node-version-file: .node-version

      - name: The books org, from the registry
        id: owner
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: echo "owner=$(curl -fsS https://raw.githubusercontent.com/textbookproject2026-alt/textbook-registry/main/registry.json | jq -er .platform.books_owner)" >> "$GITHUB_OUTPUT"

      - name: The books App's token, for the books org
        id: books
        if: github.ref == 'refs/heads/main' && vars.BOOKS_APP_CLIENT_ID != '' && steps.owner.outputs.owner != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BOOKS_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOOKS_APP_PRIVATE_KEY }}
          owner: ${{ steps.owner.outputs.owner }}
          permission-contents: write

      - name: The quartz-book bot App's token, for the platform's own account
        id: platform
        if: github.ref == 'refs/heads/main' && vars.BOT_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write

      - name: Bring each book's drafts up to its live branch
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          SLUG: ${{ inputs.slug }}
          BOOKS_OWNER: ${{ steps.owner.outputs.owner }}
          BOOKS_TOKEN: ${{ steps.books.outputs.token }}
          PLATFORM_OWNER: ${{ github.repository_owner }}
          PLATFORM_TOKEN: ${{ steps.platform.outputs.token }}
        run: node builder/sync-drafts.mjs

  plan:
    needs: drafts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      builder: ${{ steps.builder.outputs.commit }}
    steps:
      - name: Check the inputs
        env:
          WOKEN_BY: ${{ inputs.woken_by }}
          SLUG: ${{ inputs.slug }}
        run: |
          case "$WOKEN_BY" in ""|nudge|cron|stable) ;; *) echo "::error::woken_by must be empty, nudge, cron or stable, not \"$WOKEN_BY\"."; exit 1 ;; esac
          [[ -z "$SLUG" || "$SLUG" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "::error::\"$SLUG\" is not a slug."; exit 1; }

      - name: Check the stable tag exists
        if: github.ref == 'refs/heads/main'
        run: |
          git -c credential.helper= ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" refs/tags/stable >/dev/null || {
            echo "::error::quartz-book has no stable tag, so there is no builder commit to build with. Move it with Actions > stable > Run workflow (README, \"stable\")."
            exit 1
          }

      # The builder every book in this run is built with: stable from main, this
      # run's own commit from any other branch. Resolved once, here, so a tag
      # that moves during the run can't mix two builders.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref == 'refs/heads/main' && 'refs/tags/stable' || github.sha }}
          persist-credentials: false

      - name: Which builder commit
        id: builder
        run: |
          commit="$(git rev-parse HEAD)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Builder commit $commit ($([ "$GITHUB_REF" = refs/heads/main ] && echo "stable" || echo "this run's own"))."

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Compare each book and branch with its served marker
        id: plan
        env:
          SLUG: ${{ inputs.slug }}
        run: node builder/reconcile.mjs plan

  book:
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    name: ${{ matrix.target.slug }} ${{ matrix.target.branch }}
    # One build per book and branch at a time, and never cancelled. GitHub keeps
    # at most one pending run per group, and the pending one re-reads the branch
    # head when it starts, so a burst of pushes costs at most two builds (§0a).
    concurrency:
      group: book-${{ matrix.target.slug }}-${{ matrix.target.branch }}
      cancel-in-progress: false
    uses: ./.github/workflows/reconcile-book.yml
    with:
      slug: ${{ matrix.target.slug }}
      branch: ${{ matrix.target.branch }}
      project: ${{ matrix.target.project }}
      live: ${{ matrix.target.live }}
      builder: ${{ needs.plan.outputs.builder }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # The portal lists each book's pages, tags and recent changes from the book's
  # catalog, read when the portal builds. After a run that built a live branch,
  # ask the portal to rebuild. Optional: without the secret this says so and
  # stops; the portal catches up at its next build either way.
  portal:
    needs: [plan, book]
    if: >-
      always() && github.ref == 'refs/heads/main'
      && contains(needs.plan.outputs.targets, '"live":true')
      && needs.book.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Fire the portal's deploy hook
        env:
          HOOK: ${{ secrets.PORTAL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::PORTAL_DEPLOY_HOOK is not set in quartz-book, so the portal was not asked to rebuild."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" -o /dev/null && echo "Portal rebuild requested."

  # The extras pin bot (§4b): on the tick, if quartz-edition-extras' main is
  # ahead of the pin and no pull request for that commit was ever opened, start
  # bump-extras.yml. It rides this clock because a GitHub `schedule:` in this
  # quiet repo would switch itself off (§0a). It never fails the run: a red
  # tick would read as a failing book to builder-alive. It warns instead.
  extras:
    if: inputs.woken_by == 'cron' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Is extras' main ahead of the pin?
        id: due
        run: node builder/extras.mjs due

      - name: Start the bot, unless it already opened this bump
        if: steps.due.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.due.outputs.branch }}
          COMMIT: ${{ steps.due.outputs.commit }}
        run: |
          opened="$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --state all --json number --jq length)"
          if [ "$opened" != 0 ]; then
            echo "A pull request from $BRANCH was already opened (open, merged or closed), so the bot stays quiet."
            exit 0
          fi
          gh workflow run bump-extras.yml -R "$GITHUB_REPOSITORY" --ref main -f commit="$COMMIT"
          echo "Started bump-extras for extras $COMMIT."

      - name: Say so if the bot couldn't be asked
        if: failure()
        run: echo "::warning::the extras pin check failed, so no bump pull request was started. Run bump-extras by hand (README, \"The design preview gate\")."

  # Work a book's builds never see (builder/branches.mjs): files on a branch
  # that isn't built, live-branch files drafts doesn't have, and pull requests
  # into the live branch from anywhere but drafts. Each is a warning and a line
  # in the run summary. With the books App set up here (BOOKS_APP_CLIENT_ID,
  # BOOKS_APP_PRIVATE_KEY, Issues write), one issue per book is kept up to date.
  # Like extras, it never fails the run.
  branches:
    needs: drafts
    if: inputs.woken_by == 'cron' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: The books org, from the registry
        id: owner
        run: echo "owner=$(curl -fsS https://raw.githubusercontent.com/textbookproject2026-alt/textbook-registry/main/registry.json | jq -er .platform.books_owner)" >> "$GITHUB_OUTPUT"

      - name: The books App's token, for the issues
        id: app
        if: vars.BOOKS_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BOOKS_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOOKS_APP_PRIVATE_KEY }}
          owner: ${{ steps.owner.outputs.owner }}
          permission-issues: write

      # Fails until the quartz-book bot App has Issues: write (README); then the
      # books in the platform's own account get their issue too.
      - name: The quartz-book bot App's token, for the issues
        id: platform
        if: vars.BOT_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-issues: write

      - name: Flag work outside drafts
        env:
          GH_TOKEN: ${{ github.token }}
          BOOKS_OWNER: ${{ steps.owner.outputs.owner }}
          BOOKS_TOKEN: ${{ steps.app.outputs.token }}
          PLATFORM_OWNER: ${{ github.repository_owner }}
          PLATFORM_TOKEN: ${{ steps.platform.outputs.token }}
        run: node builder/branches.mjs
