name: bump-extras

# The extras pin bot (BOOK-ONE-TO-QUARTZ §4b, §8 step 11). Moves every
# quartz-edition-extras plugin in quartz.lock.json to one extras commit, on the
# branch bot/extras-<commit>, and opens a pull request for it. reconcile.yml
# starts it on the 15-minute tick when extras' main is ahead of the pin. By
# hand: Actions → bump-extras → Run workflow, branch main, `commit` empty for
# extras' main.
#
# Opening a new bump closes the older bot/extras-* pull requests, so an older
# pin can't be merged after a newer one.
#
# Who opens it. With the repository variable BOT_APP_CLIENT_ID and the secret
# BOT_APP_PRIVATE_KEY set (the `quartz-book bot` GitHub App, README), the bot
# pushes and opens the pull request as that App. Its `pull_request` runs of ci
# and design-preview then start at once, and their `build` is the check that
# main's protection requires. Without them it falls back to GITHUB_TOKEN. A
# pull request opened with GITHUB_TOKEN does start its `pull_request` runs, but
# GitHub holds them for a person to approve (`action_required`), and until
# someone does the pull request stays blocked: a `build` from a run this
# workflow dispatches passes but doesn't count on the pull request. The
# fallback still dispatches the preview and CI, so there is something to look
# at, and says the held runs need approving.

run-name: >-
  bump-extras: ${{ inputs.commit || 'extras main' }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: A full quartz-edition-extras commit. Empty for its main.
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: bump-extras
  cancel-in-progress: false

jobs:
  bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Be the bot App, if it's set up
        id: app
        if: vars.BOT_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app.outputs.token || github.token }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Move the pin
        id: bump
        env:
          COMMIT: ${{ inputs.commit }}
        run: node builder/extras.mjs bump "$COMMIT"

      - name: Open the pull request, and close the ones it supersedes
        id: pr
        if: steps.bump.outputs.changed != '0'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          AS_APP: ${{ steps.app.outputs.token != '' }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          BRANCH: ${{ steps.bump.outputs.branch }}
          TITLE: ${{ steps.bump.outputs.title }}
        run: |
          if [ "$AS_APP" = true ]; then
            name="$(gh api "/users/$APP_SLUG%5Bbot%5D" --jq '"\(.login) \(.id)"')"
            author="${name% *}"; email="${name#* }+${author}@users.noreply.github.com"
          else
            author='github-actions[bot]'; email='41898282+github-actions[bot]@users.noreply.github.com'
          fi
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null; then
            echo "$BRANCH already exists; using it as it is."
          else
            git switch --quiet -c "$BRANCH"
            git add quartz.lock.json
            git -c user.name="$author" -c user.email="$email" commit --quiet -m "$TITLE"
            git push --quiet origin "$BRANCH"
          fi
          pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            url="$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/bump-body.md")"
            pr="${url##*/}"
          fi
          echo "Pull request #$pr: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$pr"
          echo "number=$pr" >> "$GITHUB_OUTPUT"
          # Every other open bot pull request is an older bump.
          gh pr list --base main --state open --limit 100 --json number,headRefName \
              --jq ".[] | select(.headRefName | startswith(\"bot/extras-\")) | select(.number != $pr) | .number" |
          while read -r old; do
            gh pr close "$old" --delete-branch --comment "Superseded by #$pr, which pins a later extras commit. Merging this one would move the pins backwards."
            echo "Closed #$old (superseded by #$pr)."
          done

      - name: Without the App, start the preview and CI by hand
        if: steps.pr.outcome == 'success' && steps.app.outputs.token == ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.bump.outputs.branch }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          gh workflow run design-preview.yml --ref "$BRANCH" -f pr="$PR"
          gh workflow run ci.yml --ref "$BRANCH"
          echo "::warning::Opened #$PR with GITHUB_TOKEN because the bot App isn't set up (README). Its pull_request runs of ci and design-preview are held until someone approves them on the pull request, and #$PR can't merge before that."
