name: book-lint

# Every book's Markdown lint, as a reusable workflow. The book's thin caller,
# .github/workflows/lint.yml (textbook-template), keeps the triggers:
#
#   on:
#     push:
#     pull_request:
#     workflow_dispatch:
#   permissions:
#     contents: read
#   jobs:
#     markdownlint:
#       uses: textbookproject2026-alt/quartz-book/.github/workflows/book-lint.yml@main
#
# The required check on the book's live branch is "markdownlint / markdownlint"
# (book-requests scripts/lib.mjs REQUIRED_CHECKS): the caller's job id, then this job's.
#
# A reader's proposal (a proposed-edits/* pull request) is the exception: it fails
# only on problems on the lines it changes (the step at the end).
#
# Otherwise markdownlint-cli2 over every Markdown file in the checkout, with the book's own
# .markdownlint-cli2.yaml (every book has one, from the template: the author site's
# formatting check reads the same file), or the platform's copy,
# automation/.markdownlint-cli2.yaml, if it has none.

on:
  workflow_call:
    inputs:
      platform_ref:
        description: The quartz-book ref the rules are taken from. Keep it the ref the caller names after the @.
        required: false
        type: string
        default: main

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Fetch the platform's rules
        env:
          REF: ${{ inputs.platform_ref }}
        run: |
          set -euo pipefail
          git -c credential.helper= clone --quiet --depth 1 --branch "$REF" --filter=blob:none --sparse \
            https://github.com/textbookproject2026-alt/quartz-book.git "$RUNNER_TEMP/platform"
          git -C "$RUNNER_TEMP/platform" sparse-checkout set automation
          echo "quartz-book at $REF: $(git -C "$RUNNER_TEMP/platform" rev-parse HEAD)"

      - name: Use the platform's rules unless the book has its own
        run: |
          if [ -f .markdownlint-cli2.yaml ]; then
            echo "Using the book's own .markdownlint-cli2.yaml."
          else
            cp "$RUNNER_TEMP/platform/automation/.markdownlint-cli2.yaml" .markdownlint-cli2.yaml
          fi

      - uses: DavidAnson/markdownlint-cli2-action@v20
        if: ${{ !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'proposed-edits/')) }}
        with:
          globs: "**/*.md"

      # A reader's proposal is judged on its own lines only: the files it changes,
      # and of those, the lines it adds or changes (automation/scripts/lint-own-lines.mjs).
      # A problem the authors already had on drafts is a notice, not the reader's failure.
      - name: A reader's proposal, its own lines
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'proposed-edits/') }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          git fetch --quiet --depth 1 origin "$BASE"
          mapfile -t files < <(git diff --name-only --diff-filter=AM "$BASE" HEAD -- '*.md')
          if [ ${#files[@]} -eq 0 ]; then echo "No Markdown changed."; exit 0; fi
          git diff -U0 --diff-filter=AM "$BASE" HEAD -- '*.md' > "$RUNNER_TEMP/proposal.diff"
          npx --yes markdownlint-cli2@0.18.1 "${files[@]}" > "$RUNNER_TEMP/lint.txt" 2>&1
          cat "$RUNNER_TEMP/lint.txt"
          node "$RUNNER_TEMP/platform/automation/scripts/lint-own-lines.mjs" "$RUNNER_TEMP/proposal.diff" "$RUNNER_TEMP/lint.txt"
