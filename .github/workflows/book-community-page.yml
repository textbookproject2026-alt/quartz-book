name: book-community-page

# A book's weekly community page (contributors, dashboard or derivatives), as a
# reusable workflow (BOOK-ONE-TO-QUARTZ §8 step 14, D6). Each book keeps a thin
# caller with its own schedule, because GitHub runs workflows only from the repo
# itself, and the pull request needs that repo's GITHUB_TOKEN:
#
#   on:
#     schedule:
#       - cron: "0 7 * * 0"
#     workflow_dispatch:
#   permissions:
#     contents: write
#     pull-requests: write
#   jobs:
#     contributors:
#       uses: textbookproject2026-alt/quartz-book/.github/workflows/book-community-page.yml@stable
#       with:
#         page: contributors
#
# The dashboard also needs `secrets: { HYPOTHESIS_API_TOKEN: ${{ secrets.HYPOTHESIS_API_TOKEN }} }`.
#
# The job regenerates community/<page>.md in the book's checkout with
# automation/scripts/gen-<page>.mjs, and when the page changed, pushes it to the
# machine-owned branch chore/<page>-update and opens (or updates) one pull
# request into the live branch. It arms auto-merge only on a pull request that
# github-actions[bot] opened and that changes exactly that one page. main is
# protected and github-actions[bot] cannot push to it, which is why this is a
# pull request and not a push.
#
# It always works on `branch` (the book's live branch), whichever ref started
# it, so a run started by hand from another branch does exactly what the
# Sunday run does.
#
# Needs, in the book repo: "Allow auto-merge" (Settings -> General) for the
# auto-merge, and HYPOTHESIS_API_TOKEN (the backup's secret) for the dashboard.

on:
  workflow_call:
    inputs:
      page:
        description: contributors, dashboard or derivatives.
        required: true
        type: string
      branch:
        description: The book's live branch, which the page is read from and proposed to.
        required: false
        type: string
        default: main
      platform_ref:
        description: The quartz-book ref the scripts are taken from. Keep it the ref the caller names after the @.
        required: false
        type: string
        default: stable
    secrets:
      HYPOTHESIS_API_TOKEN:
        required: false

jobs:
  page:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the chore/<page>-update branch
      pull-requests: write # open or update the pull request
    concurrency:
      group: book-community-${{ inputs.page }}
      cancel-in-progress: false
    env:
      PAGE_NAME: ${{ inputs.page }}
      PAGE: community/${{ inputs.page }}.md
      PR_BRANCH: chore/${{ inputs.page }}-update
      BASE: ${{ inputs.branch }}

    steps:
      - name: Which page
        id: which
        run: |
          set -euo pipefail
          case "$PAGE_NAME" in
            contributors)
              echo "title=chore(community): refresh contributors page" >> "$GITHUB_OUTPUT"
              echo "label=Contributors page" >> "$GITHUB_OUTPUT"
              ;;
            dashboard)
              echo "title=chore(community): refresh project dashboard" >> "$GITHUB_OUTPUT"
              echo "label=Dashboard" >> "$GITHUB_OUTPUT"
              ;;
            derivatives)
              echo "title=chore(community): refresh derivatives map" >> "$GITHUB_OUTPUT"
              echo "label=Derivatives map" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::page must be contributors, dashboard or derivatives, not \"$PAGE_NAME\"."
              exit 1
              ;;
          esac

      - name: Check the API token secret is present
        if: inputs.page == 'dashboard'
        env:
          HYPOTHESIS_API_TOKEN: ${{ secrets.HYPOTHESIS_API_TOKEN }}
        run: |
          if [ -z "$HYPOTHESIS_API_TOKEN" ]; then
            echo "::error::HYPOTHESIS_API_TOKEN did not reach this workflow. It is the book repo's secret (the one the annotation backup uses): add it under Settings -> Secrets and variables -> Actions, from https://hypothes.is/account/developer while signed in as the account that owns the annotation groups, and check that the caller passes it under secrets:."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0 # the contributors page is built from the whole history

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Fetch the platform's scripts
        env:
          REF: ${{ inputs.platform_ref }}
        run: |
          set -euo pipefail
          git -c credential.helper= clone --quiet --depth 1 --branch "$REF" --filter=blob:none --sparse \
            https://github.com/textbookproject2026-alt/quartz-book.git "$RUNNER_TEMP/platform"
          git -C "$RUNNER_TEMP/platform" sparse-checkout set automation
          echo "quartz-book at $REF: $(git -C "$RUNNER_TEMP/platform" rev-parse HEAD)"

      - name: Regenerate the page
        env:
          HYPOTHESIS_API_TOKEN: ${{ secrets.HYPOTHESIS_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/platform/automation/scripts/gen-${PAGE_NAME}.mjs"

      - name: Has the page actually changed?
        id: page
        env:
          LABEL: ${{ steps.which.outputs.label }}
        run: |
          set -euo pipefail
          # Untracked counts too: a new book's first run creates the page.
          if [ -z "$(git status --porcelain -- "$PAGE")" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "${LABEL} is already current — nothing to propose."
            echo "${LABEL} already current; no pull request opened." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- "$PAGE"
          fi

      - name: Open or update the pull request
        id: pr
        if: steps.page.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.which.outputs.title }}
          LABEL: ${{ steps.which.outputs.label }}
          CALLER: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          OPEN_PR="$(gh pr list --head "$PR_BRANCH" --state open --json number --jq '.[0].number // empty')"

          # Already proposing exactly this page? Then don't touch it: a force-push
          # would restart its checks and reset any review for nothing.
          if [ -n "$OPEN_PR" ] && git fetch --quiet origin "$PR_BRANCH" 2>/dev/null; then
            if git show "FETCH_HEAD:$PAGE" 2>/dev/null | diff -q - "$PAGE" >/dev/null 2>&1; then
              echo "PR #${OPEN_PR} already proposes this exact page — leaving it alone."
              echo "${LABEL} PR #${OPEN_PR} already up to date." >> "$GITHUB_STEP_SUMMARY"
              echo "number=${OPEN_PR}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          git checkout -q -B "$PR_BRANCH"
          git add -- "$PAGE"
          git commit -q -m "$TITLE"
          git push --quiet --force origin "HEAD:refs/heads/$PR_BRANCH"

          if [ -n "$OPEN_PR" ]; then
            echo "Updated existing PR #${OPEN_PR}."
            echo "Updated ${LABEL} PR #${OPEN_PR}." >> "$GITHUB_STEP_SUMMARY"
            echo "number=${OPEN_PR}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          WORKFLOW="${CALLER#*/*/}"
          WORKFLOW="${WORKFLOW%@*}"
          SCRIPT="quartz-book's \`automation/scripts/gen-${PAGE_NAME}.mjs\`"
          case "$PAGE_NAME" in
            contributors)
              cat > "${RUNNER_TEMP}/pr-body.md" <<BODY
          Rebuilds \`${PAGE}\` from the commit history, as \`${WORKFLOW}\` does every Sunday.

          The page is generated by ${SCRIPT}: commit counts,
          first and most recent contribution, and each contributor's most-worked-on
          pages under \`chapters/\`. Bot identities are excluded from the table.
          BODY
              ;;
            dashboard)
              cat > "${RUNNER_TEMP}/pr-body.md" <<BODY
          Rebuilds \`${PAGE}\` from the Hypothes.is and GitHub APIs,
          as \`${WORKFLOW}\` does every Sunday.

          The page is generated by ${SCRIPT}: annotation totals
          for the public layer and each course group, contributor and commit
          counts, the number of department editions, what is open against the
          repository, and the state of the \`suggested-edit\` queue. Readership is
          linked to the site's public Plausible dashboard rather than copied.

          No individual annotator is named or counted on this page — the
          annotation figures are aggregates only.
          BODY
              ;;
            derivatives)
              cat > "${RUNNER_TEMP}/pr-body.md" <<BODY
          Rebuilds \`${PAGE}\` from the forks of the edition
          template, as \`${WORKFLOW}\` does every Sunday.

          The page is generated by ${SCRIPT}: one entry per
          department edition, with its owner, what it is, when it last changed,
          and links to the repository and — where the repository says so — the
          live site. Archived forks and the project's own copies are left out.

          A new entry here means someone has published an edition; a changed
          date means an existing one has moved.
          BODY
              ;;
          esac
          cat >> "${RUNNER_TEMP}/pr-body.md" <<'BODY'

          Nothing here is urgent — merge it whenever, or close it and the next run
          will propose the page again.
          BODY

          URL="$(gh pr create \
            --base "$BASE" \
            --head "$PR_BRANCH" \
            --title "$TITLE" \
            --body-file "${RUNNER_TEMP}/pr-body.md")"

          echo "Opened ${URL}"
          echo "Opened ${LABEL} PR: ${URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "number=${URL##*/}" >> "$GITHUB_OUTPUT"

      # Auto-merge only a pull request that is provably this job's own and changes
      # nothing but the one page. Anything else is left for a person.
      - name: Arm auto-merge on the pull request
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          LABEL: ${{ steps.which.outputs.label }}
        run: |
          set -euo pipefail

          WHO="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '.user.login + "/" + .user.type')"
          if [ "$WHO" != "github-actions[bot]/Bot" ]; then
            echo "::warning::PR #${PR} is authored by ${WHO}, not github-actions[bot]/Bot — leaving it for a human."
            exit 0
          fi

          FILES="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --jq '.[].filename')"
          if [ "$FILES" != "$PAGE" ]; then
            echo "::warning::PR #${PR} changes [${FILES}], not exactly ${PAGE} — leaving it for a human."
            exit 0
          fi

          if gh pr merge "$PR" --auto --squash; then
            echo "Auto-merge armed on PR #${PR}; it squashes itself once ${BASE} is satisfied."
            echo "Auto-merge armed on ${LABEL} PR #${PR}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # --auto refuses when nothing is left to wait for; merge directly then.
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '.mergeable_state')" = "clean" ] \
            && gh pr merge "$PR" --squash; then
            echo "Nothing left to wait for; merged PR #${PR}."
            echo "Merged ${LABEL} PR #${PR}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::warning::Could not arm auto-merge on PR #${PR}. Check that \"Allow auto-merge\" is on under Settings -> General, and that ${BASE}'s protection lets github-actions[bot] merge. The pull request is open and untouched."
