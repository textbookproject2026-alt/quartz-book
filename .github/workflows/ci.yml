name: ci

# The builder's proof (BOOK-ONE-TO-QUARTZ §8 step 8): its own tests, the fixture
# book, and a full build of a live book from its current live branch: the first
# `live` book on the builder in the registry (book one until it was retired,
# 27 Sep 2026). Nothing is deployed
# here: reconcile.yml deploys (§8 step 9). When this passes on a push to main,
# stable.yml moves the `stable` tag there (§8 step 11).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # The layout checks' summary goes on the pull request as one comment.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Cache Quartz plugins
        uses: actions/cache@v5
        with:
          path: .quartz/plugins
          # Exact key only, no restore-keys: a pin bump must miss the cache.
          # `quartz plugin install` keeps a populated plugin directory without
          # comparing it with the lock file, so a fallback restore would build
          # with the old plugins behind a green run.
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}

      - run: npm ci

      - name: Install Quartz plugins
        run: npx quartz plugin install

      # quartz/cli/plugin-git-handlers.js carries a platform patch: upstream copied
      # a subdir plugin (every extras plugin) from its repo's default branch and
      # ignored the lock. This fails if an upstream update ever drops the patch.
      - name: Every subdir plugin is the commit the lock pins
        run: |
          node -e '
            const fs = require("fs")
            const { plugins } = JSON.parse(fs.readFileSync("quartz.lock.json", "utf8"))
            let bad = 0
            for (const [name, e] of Object.entries(plugins)) {
              if (!e.subdir) continue
              let got = "(none)"
              try { got = fs.readFileSync(`.quartz/plugins/${name}/.quartz-locked-commit`, "utf8").trim() } catch {}
              const ok = got === e.commit
              if (!ok) bad++
              console.log(`${ok ? "ok  " : "BAD "} ${name}: lock ${e.commit.slice(0, 7)}, installed ${got.slice(0, 7)}`)
            }
            process.exit(bad ? 1 : 0)
          '

      - name: Style
        run: npx prettier --check builder test fixtures/registry.json quartz.config.yaml

      - name: The builder's and the book automation's tests (fixture book, fixture registry)
        run: node --test test/lib.test.mjs test/catalog.test.mjs test/history.test.mjs test/preview.test.mjs test/automation.test.mjs test/build.test.mjs

      - name: Which live book
        id: book
        run: |
          read -r slug repo branch < <(node test/check-live-book.mjs --pick)
          echo "Building $slug ($repo@$branch)."
          { echo "slug=$slug"; echo "repo=$repo"; echo "branch=$branch"; } >> "$GITHUB_OUTPUT"

      - name: Check out that book, anonymously, as the builder will
        env:
          REPO: ${{ steps.book.outputs.repo }}
          BRANCH: ${{ steps.book.outputs.branch }}
        run: >
          git -c credential.helper= clone --quiet --branch "$BRANCH"
          "https://github.com/$REPO.git" "$RUNNER_TEMP/live-book"

      - name: Build it
        # With a Hypothes.is client, so the sidebar layout is still checked
        # (builder/prepare.mjs); books themselves have no public layer.
        env:
          TB_LAYOUT_ANNOTATIONS: public
        run: ./build-book.sh "$RUNNER_TEMP/live-book" --branch "${{ steps.book.outputs.branch }}" --out "$RUNNER_TEMP/live-book-site"

      - name: Check the build
        run: node test/check-live-book.mjs "$RUNNER_TEMP/live-book-site" "$RUNNER_TEMP/live-book" "${{ steps.book.outputs.slug }}"

      # The phone layout in real device emulation (Pixel 7 in Chromium, iPhone 13
      # in WebKit), through every state: loaded, menu open and closed, after
      # navigating through the menu, the annotation sidebar opened and closed.
      # It needs the network: the built pages load Hypothes.is from hypothes.is.
      - name: Install the emulated phones' browsers
        run: npx playwright-core install --with-deps chromium webkit

      - name: Phone layout (Pixel 7, iPhone 13)
        run: |
          node test/serve-static.mjs "$RUNNER_TEMP/live-book-site" 8801 &
          sleep 1
          node test/phone-layout.mjs http://127.0.0.1:8801/ "$RUNNER_TEMP/phone-layout"

      # The reader's layout at a dozen widths at and around each switch point, in
      # Chromium and WebKit, and an Android Chrome emulation (test/layout-checks.mjs).
      - name: Layout checks (header, panels, scroll, reading)
        id: layout
        run: |
          node test/serve-static.mjs "$RUNNER_TEMP/live-book-site" 8803 &
          sleep 1
          node test/layout-checks.mjs http://127.0.0.1:8803/ "$RUNNER_TEMP/layout-checks"

      - name: Layout checks on the pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          [ -f "$RUNNER_TEMP/layout-checks/summary.md" ] || exit 0
          body="$RUNNER_TEMP/layout-comment.md"
          { echo "<!-- layout-checks -->"; cat "$RUNNER_TEMP/layout-checks/summary.md"; echo; echo "At \`${HEAD:0:7}\`; screenshots of failing widths in the run's layout-checks artifact."; } > "$body"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- layout-checks -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$body" --silent
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F "body=@$body" --silent
          fi

      - name: The explorer and the folder page follow index.md's Contents
        run: |
          node test/serve-static.mjs "$RUNNER_TEMP/live-book-site" 8802 &
          sleep 1
          node test/explorer-order.mjs http://127.0.0.1:8802/ "$RUNNER_TEMP/live-book"

      - name: Keep the phone screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phone-layout
          path: ${{ runner.temp }}/phone-layout
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep the layout checks' screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: layout-checks
          path: ${{ runner.temp }}/layout-checks
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep the build for a look
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-book-site
          path: ${{ runner.temp }}/live-book-site
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
